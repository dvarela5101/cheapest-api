load:
  # =================================================================
  # Diseño de datos para el warm-up del Lab 2 (pruebas de carga).
  # Escenario modelado: UNA ciudad dentro de la operación de Cheapest
  # (~3.000 tiendas y ~1.200 referencias activas hoy, según el
  # enunciado). No se replica toda la red nacional, sino un nodo de
  # ciudad representativo, suficiente para forzar los JOINs que se
  # van a medir (pedidos históricos ∩ promociones activas ∩
  # catálogo/disponibilidad de zona) y la escritura transaccional de
  # pedidos, sin que el seed tarde minutos en correr localmente.
  #
  # IMPORTANTE (verificado simulando pickAssigned() del seeder):
  # `distribucion: pareto` no solo sesga pedidos/catálogos por
  # tienda: también sesga la ZONA asignada a cada catálogo, con el
  # mismo mecanismo de "8 de cada 10 al grupo cabeza". Con pocas
  # filas eso puede dejar zonas en CERO (no solo "con menos"), así
  # que los conteos de abajo ya están ajustados para que las 5 zonas
  # queden representadas.
  # =================================================================

  # --- Dimensiones del negocio ---
  tiendas: 80
  # Recorte de una ciudad dentro de la red de ~3.000 tiendas de
  # Cheapest. Solo lo usan catalogos, promocion_tiendas, pedidos e
  # items_pedido (vía pickAssigned/effectiveTiendaIds). Las tablas de
  # inventario y ventas del POS NO leen esta llave (ver nota abajo).

  zonas: 5
  # Zona Norte, Sur, Oriente, Occidente, Centro: coincide con los 5
  # nombres reservados en el seeder (zonaBaseNames), legible en vez
  # de "Zona 6", "Zona 7", etc.

  distribucion:
    tipo: pareto
    peso_cabeza: 0.75      # 75% de la actividad cae en la zona/tienda "cabeza"
    fraccion_cabeza: 0.2   # esa cabeza es 1 de las 5 zonas / ~16 de las 80 tiendas
  # Zona Centro/tiendas "cabeza" concentran la mayoría del pedido y
  # catálogo vigente, como pide el enunciado ("zonas con más
  # actividad comercial, productos más populares que otros").
  # Simulé pickAssigned() con estos parámetros: la tienda fija que
  # usa `load_test.jmx` (bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb,
  # zona=Zona Norte, ambos definidos en seed.sql) cae exactamente en
  # el grupo cabeza -> es EL peor caso real que la prueba GET va a
  # medir, no un caso promedio optimista.

  # --- Logística ---
  productos: 1200
  # Cifra textual del enunciado como catálogo activo actual de
  # Cheapest. No se usa la meta de 6.000 (expansión futura, no el
  # estado que este load test debe reflejar).

  catalogos: 40
  # Antes tenía 10 (2 "por zona"), pero simulando pickAssigned()
  # confirmé que con pareto activo, la zona de cada catálogo TAMBIÉN
  # se sesga 75/20: con solo 10 filas, 3 de las 5 zonas (Oriente,
  # Occidente, Centro) quedaban con CERO catálogos -> el GET para
  # esas zonas habría devuelto vacío por construcción, no por carga
  # real. Con 40 filas la distribución real queda Zona Norte=32,
  # Sur=2, Oriente=2, Occidente=2, Centro=2: todas las zonas con al
  # menos "base + promocional", y Norte siguiendo concentrando ~80%
  # como corresponde a la zona de mayor densidad comercial.

  catalogos_productos: 12000
  # ~300 productos visibles en promedio por catálogo (300 x 40 =
  # 12.000), 25% del catálogo total de 1.200. Refleja que "el
  # tendero solo debe ver lo que realmente está disponible para su
  # zona", no el listado completo.

  promociones: 20
  # Pocas promociones activas a la vez (gobernanza estricta: "una
  # promoción mal configurada puede provocar pérdidas masivas").
  # Nota de cobertura (verificada por simulación): con solo 20 filas
  # y 80 tiendas, promocion_tiendas termina tocando apenas 4 tiendas
  # en todo el histórico -entre ellas la tienda fija del JMeter test,
  # que sí necesita tener una promoción activa para que el JOIN de
  # ASR1 tenga algo que intersectar-. El resto de tiendas sin
  # promoción histórica es coherente con que la mayoría de tiendas no
  # tiene oferta vigente en un momento dado.

  pedidos: 24000
  # 300 pedidos/tienda en promedio (~6/semana en un año), coherente
  # con reabasto frecuente en cantidades chicas (promesa <24h) en vez
  # de acumular stock. Verificado: por el pareto, la tienda fija del
  # JMeter test concentra 1.200 pedidos históricos vs. ~74 de una
  # tienda "cola" (16x) -exactamente el peor caso de JOIN que debe
  # seguir cumpliendo p99 < 1000ms.

  items_pedido: 72000
  # 3 ítems promedio por pedido (72.000 / 24.000), tomando el propio
  # ejemplo del enunciado: "2 cajas de leche, 1 paquete de arroz y 6
  # unidades de jabón" = 3 líneas.

  despachos: 9000
  # El seeder reparte los 8 estados de pedido en round-robin; de
  # esos, 3 (despachado, entregado, devuelto) implican que ya existió
  # un despacho físico => 3/8 x 24.000 ≈ 9.000.

  disponibilidad_zona: 12000
  # Igual a catalogos_productos: cada combinación catálogo-producto
  # necesita su registro de disponibilidad, que es la tabla que el
  # endpoint de lectura hace JOIN para decidir qué mostrar.

  notas_credito: 480
  # 2% de los 24.000 pedidos: tasa de reclamos/devoluciones baja pero
  # no cero, consistente con la vigilancia antifraude que pide el
  # enunciado ("notas crédito repetidas por la misma tienda").

  # --- Inventario y Ventas POS ---
  # AVISO IMPORTANTE (leído directamente del código del seeder, no
  # supuesto): seedItemsInventario, seedRegistrosCompra,
  # seedRegistrosVenta, seedProductosExternos y seedVentas usan
  # `this.tiendaIds[index % this.tiendaIds.length]`, es decir, SIEMPRE
  # las 2 tiendas fijas de seed.sql, repartido 50/50 -ignoran por
  # completo `tiendas`, `zonas` y `distribucion`-. Es una limitación
  # del script tal como está, no de esta configuración yaml.
  # Además, NINGUNA de estas 6 tablas participa en los dos endpoints
  # evaluados (GET /productos-disponibles solo hace JOIN con pedidos +
  # promociones + catálogo/disponibilidad; POST /pedidos solo escribe
  # en pedidos + items_pedido). Por eso su volumen no afecta el
  # resultado de los ASR de este laboratorio: se dejan pobladas, en
  # proporción a las 2 tiendas reales que sí usa el script, solo por
  # completitud de la base, no por presión de carga.

  items_inventario: 300
  # 150 SKUs en stock en promedio por cada una de las 2 tiendas
  # realmente usadas (150 x 2 = 300), ~25% del catálogo de 1.200:
  # una tienda de barrio no exhibe todo el catálogo nacional.

  registros_compra_producto_tienda: 600
  # 2 reabastos promedio por item_inventario (300 x 2), alimentando
  # el histórico de compras del motor de sugerencia de pedido.

  registros_venta_producto_tienda: 1500
  # 5 ventas promedio por item_inventario (300 x 5): las ventas al
  # público son más frecuentes que los reabastos.

  # --- Ventas (venta libre / fuera de catálogo en el POS) ---
  productos_externos: 10
  # 5 productos "libres" en promedio por cada una de las 2 tiendas
  # reales (5 x 2): función ocasional del POS para registrar lo que
  # no está en el catálogo formal, no el flujo principal de venta.

  ventas: 80
  # Tickets de POS que incluyen al menos un producto externo, ~40
  # por tienda real en el histórico. Se mantiene bajo porque, en este
  # modelo, ventas/items_venta solo referencian productos_externos
  # (productoId queda null) -representa el caso "vendí algo fuera de
  # catálogo", no el total de ventas de mostrador.

  items_venta: 160
  # 2 ítems externos promedio por venta (160 / 80), consistente con
  # que suelen ser 1-2 productos puntuales no dados de alta.
